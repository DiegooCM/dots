# Lo q quiero:
# cb w: borrar una window
# cb v: abrir una a verticalmente.
# cb h: abrir una horizontalmente

# tmux a = tmux (para abrir tmux en la sesion donde lo he dejado)

# Para que funcione bien con la config de nvim: 
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# para hacer el reload de los settings mas facil
unbind r
bind r source-file ~/.config/tmux/.tmux.conf

set-option -g prefix C-f

set -g mouse on 

# Mover entre las pantallas con lo de vim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Borrar pane con w
bind-key w kill-pane

# Borrar window con W
bind-key W kill-window

# para q la barra de tmux salga arriba
set-option -g status-position top

# Catppuccin confs
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_status_modules_right "date_time"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -g status-left ""

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
